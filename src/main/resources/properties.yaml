# Base de datos - H2 en memoria
spring:
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

    # create-drop: crea las tablas al arrancar, borra al apagar
    # NUNCA EN PROD
    hibernate:
      ddl-auto:create-drop

    # Muestra las queries SQL que ejecuta JPA en la consola
    show-sql: true
    properties:hibernate:
      format_sql: true

    # Consola web de H2 para ver la BD desde el browser
  h2:
    console:
      enabled: true
      path: /h2-console